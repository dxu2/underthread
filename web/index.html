<!-- t-visual-ink: 墨刊 skin, set before first paint. t-theme-trim: always on (rt.skin="classic" and #skin=classic are ignored, the switches are gone); t-theme-trim2: rt.inkLight is ignored too (neutral paper, its switch is gone). -->
<script>(function(){var d=document.documentElement;d.dataset.skin="ink";var g=false;try{g=JSON.parse(localStorage.getItem("rt.stage"))===true;}catch(e){}var h=/[#&]stage=(1|0)/.exec(location.hash);if(h)g=h[1]==="1";if(g)d.dataset.stage="1";try{if(JSON.parse(localStorage.getItem("rt.powerSave"))===false)d.dataset.power="off";}catch(e){}var x=null;try{x=JSON.parse(localStorage.getItem("rt.texture"));}catch(e){}var xh=/[#&]texture=(\w+)/.exec(location.hash);if(xh)x=xh[1];if(typeof x==="string"&&/^[a-z0-9]{1,16}$/.test(x)&&x!=="off")d.dataset.texture=x;})();</script>
<!-- t-settings-tab / t-theme-auto: theme mode before first paint. rt.themeMode auto|manual; a device with no saved theme starts on auto.
     Auto: system dark -> dark (夜), light -> white (昼); neither answered -> 07:00-19:00 white. Writes rt.theme so app.js picks it up. -->
<script>(function(){var d=document.documentElement,L=localStorage,m=null,t=null;try{m=JSON.parse(L.getItem("rt.themeMode"));}catch(e){}
try{if(m!=="auto"&&m!=="manual"){m=L.getItem("rt.theme")?"manual":"auto";L.setItem("rt.themeMode",JSON.stringify(m));}}catch(e){m="manual";}
if(m!=="auto"||/[#&]theme=/.test(location.hash))return;var q=function(s){return matchMedia("(prefers-color-scheme: "+s+")").matches;},h=new Date().getHours();
t=q("dark")?"dark":q("light")?"white":(h>=7&&h<19?"white":"dark");try{L.setItem("rt.theme",JSON.stringify(t));}catch(e){}d.dataset.theme=t;
var c=document.querySelector('meta[name="theme-color"]');if(c)c.content=t==="white"?"#ffffff":"#040404";})();</script>
<!-- t-theme-ut: 配色 before first paint. rt.ut = "ut" (default in the open-source build) | "ink"; ut sets data-ut (dark-warm / light-warm by the theme) and pauses the stage (rt.stage is kept). mobile.js ui13 keeps it in step. -->
<script>(function(){var d=document.documentElement,L=localStorage,u=null,t=d.dataset.theme,h;try{u=JSON.parse(L.getItem("rt.ut"));}catch(e){}if(u==="ink")return;
try{var r=JSON.parse(L.getItem("rt.theme"));if(r)t=r;}catch(e){}h=/[#&]theme=(\w+)/.exec(location.hash);if(h)t=h[1];var w=t==="white"||t==="light";
d.dataset.ut=w?"light-warm":"dark-warm";delete d.dataset.stage;var c=document.querySelector('meta[name="theme-color"]');if(c)c.content=w?"#F7ECDA":"#1F110D";})();</script>
<!-- t-splash: opening (B 穿针) guard. Plays once per session unless rt.splash.mode="off", the tab opened in the background, or the hash has #nosplash / push= (a notification tap goes straight to the card).
     Covers the first frame in the theme's base colour until splash.js takes over; drops itself after 4 s whatever happens. -->
<script>(function(){var d=document.documentElement,L=localStorage,m="session",t=d.dataset.theme,h;try{m=JSON.parse(L.getItem("rt.splash.mode"))||"session";}catch(e){}
if(m==="off"||document.visibilityState==="hidden"||/[#&](nosplash|push=)/.test(location.hash))return;try{if(sessionStorage.getItem("rt.splash")==="1")return;sessionStorage.setItem("rt.splash","1");}catch(e){return;}
try{var r=JSON.parse(L.getItem("rt.theme"));if(r)t=r;}catch(e){}h=/[#&]theme=(\w+)/.exec(location.hash);if(h)t=h[1];
d.dataset.splash="1";d.style.setProperty("--ut-guard",t==="white"?"#ffffff":t==="light"?"#e8e0cc":"#040404");setTimeout(function(){d.removeAttribute("data-splash");},4000);})();</script>
